<svg xmlns="http://www.w3.org/2000/svg" width="520" height="250" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
  <title id="title">Model comparison</title>
  <desc id="desc">Data-backed chart generated from repository files.</desc>
  <rect width="1040" height="500" rx="24" fill="#FFFFFF"/>
  <text x="54.0" y="58.0" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700" fill="#0F172A" text-anchor="start">Congestion-index prediction comparison</text>
  <text x="54.0" y="88.0" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#64748B" text-anchor="start">Recomputed on 4,351 non-missing stored prediction pairs per model</text>
  <line x1="250.0" y1="110" x2="250.0" y2="430" stroke="#CBD5E1" stroke-width="1"/>
  <text x="250.0" y="456.0" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle">0.000</text>
  <line x1="430.0" y1="110" x2="430.0" y2="430" stroke="#CBD5E1" stroke-width="1"/>
  <text x="430.0" y="456.0" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle">0.004</text>
  <line x1="610.0" y1="110" x2="610.0" y2="430" stroke="#CBD5E1" stroke-width="1"/>
  <text x="610.0" y="456.0" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle">0.008</text>
  <line x1="790.0" y1="110" x2="790.0" y2="430" stroke="#CBD5E1" stroke-width="1"/>
  <text x="790.0" y="456.0" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle">0.012</text>
  <line x1="970.0" y1="110" x2="970.0" y2="430" stroke="#CBD5E1" stroke-width="1"/>
  <text x="970.0" y="456.0" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle">0.016</text>
  <text x="232.0" y="156.0" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#0F172A" text-anchor="end">XGBoost</text>
  <rect x="250" y="128" width="72.4" height="24" rx="6" fill="#06B6D4"/>
  <rect x="250" y="162" width="101.0" height="24" rx="6" fill="#2563EB"/>
  <text x="361.0" y="180.0" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">R² 0.9997</text>
  <text x="232.0" y="260.0" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#0F172A" text-anchor="end">Random Forest</text>
  <rect x="250" y="232" width="170.1" height="24" rx="6" fill="#06B6D4"/>
  <rect x="250" y="266" width="347.1" height="24" rx="6" fill="#2563EB"/>
  <text x="607.1" y="284.0" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">R² 0.9964</text>
  <text x="232.0" y="364.0" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#0F172A" text-anchor="end">Gradient Boosting</text>
  <rect x="250" y="336" width="354.3" height="24" rx="6" fill="#06B6D4"/>
  <rect x="250" y="370" width="610.2" height="24" rx="6" fill="#2563EB"/>
  <text x="870.2" y="388.0" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">R² 0.9890</text>
  <rect x="54" y="432" width="14" height="14" rx="3" fill="#06B6D4"/>
  <text x="76.0" y="444.0" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">MAE</text>
  <rect x="130" y="432" width="14" height="14" rx="3" fill="#2563EB"/>
  <text x="152.0" y="444.0" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">RMSE</text>
  <text x="986.0" y="444.0" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="end">Error (lower is better)</text>
</svg>
