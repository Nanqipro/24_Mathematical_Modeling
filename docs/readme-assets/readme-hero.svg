<svg xmlns="http://www.w3.org/2000/svg" width="700" height="250" viewBox="0 0 1400 500" role="img" aria-labelledby="title desc">
  <title id="title">高速公路拥堵预测与应急车道决策项目</title>
  <desc id="desc">蓝色高速公路、监控节点与预测决策流程组成的项目横幅。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.62" stop-color="#0B3B63"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1400" height="500" rx="34" fill="url(#background)"/>
  <circle cx="1240" cy="90" r="180" fill="#22D3EE" opacity="0.08"/>
  <circle cx="1090" cy="460" r="260" fill="#2563EB" opacity="0.12"/>

  <g transform="translate(820 72)">
    <path d="M70 330 C210 250 250 125 470 25" fill="none" stroke="#0B1220" stroke-width="116" stroke-linecap="round"/>
    <path d="M70 330 C210 250 250 125 470 25" fill="none" stroke="url(#road)" stroke-width="96" stroke-linecap="round"/>
    <path d="M70 330 C210 250 250 125 470 25" fill="none" stroke="#F8FAFC" stroke-width="5" stroke-dasharray="24 24" opacity="0.85"/>
    <path d="M96 348 C238 266 278 140 493 47" fill="none" stroke="#F59E0B" stroke-width="4" stroke-dasharray="16 14" opacity="0.9"/>
    <g fill="#22D3EE" stroke="#ECFEFF" stroke-width="4" filter="url(#glow)">
      <circle cx="133" cy="290" r="11"/>
      <circle cx="240" cy="207" r="11"/>
      <circle cx="335" cy="114" r="11"/>
      <circle cx="449" cy="48" r="11"/>
    </g>
    <g fill="#E0F2FE" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">
      <text x="105" y="272">P1</text><text x="210" y="188">P2</text>
      <text x="305" y="96">P3</text><text x="416" y="29">P4</text>
    </g>
  </g>

  <g transform="translate(76 68)">
    <rect width="186" height="38" rx="19" fill="#0EA5E9" opacity="0.2" stroke="#38BDF8"/>
    <text x="93" y="25" text-anchor="middle" fill="#BAE6FD" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="700">2024 · 华为杯二等奖</text>
    <text x="0" y="112" fill="#FFFFFF" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="50" font-weight="800">高速公路拥堵预测</text>
    <text x="0" y="174" fill="#FFFFFF" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="50" font-weight="800">与应急车道决策</text>
    <text x="2" y="220" fill="#BAE6FD" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="21">视频检测 · 交通状态建模 · 预测预警 · 多目标决策</text>
    <g transform="translate(0 272)" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">
      <rect width="126" height="42" rx="12" fill="#FFFFFF" opacity="0.11"/><text x="63" y="27" text-anchor="middle" fill="#E0F2FE">YOLO + Deep SORT</text>
      <rect x="140" width="96" height="42" rx="12" fill="#FFFFFF" opacity="0.11"/><text x="188" y="27" text-anchor="middle" fill="#E0F2FE">XGBoost</text>
      <rect x="250" width="102" height="42" rx="12" fill="#FFFFFF" opacity="0.11"/><text x="301" y="27" text-anchor="middle" fill="#E0F2FE">TOPSIS</text>
      <rect x="366" width="82" height="42" rx="12" fill="#FFFFFF" opacity="0.11"/><text x="407" y="27" text-anchor="middle" fill="#E0F2FE">LSTM</text>
    </g>
  </g>
</svg>
